[tool.poetry]
name = "docmaker"
version = "0.1.0"
description = "Génère une documentation SGBD RAG-ready à partir de sources hétérogènes"
authors = ["facoleur <facoleur@gmail.com>"]
readme = "README.md"
packages = [{ include = "docmaker" }]
include = ["docmaker/templates/*.j2"]

[tool.poetry.dependencies]
python = "^3.12"
docling = "^2.0"
openai = "^1.40"
pydantic = "^2.7"
python-dotenv = "^1.0"
jinja2 = "^3.1"
rich = "^13.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"

[tool.poetry.scripts]
docmaker = "docmaker.__main__:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
