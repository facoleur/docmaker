# Toute la configuration du pipeline. Aucune option en ligne de commande.
# Ce fichier est la SOURCE des valeurs : le code (config.py) n'a que le schéma,
# aucune valeur par défaut. Chaque clé ci-dessous est obligatoire.
# Le secret LLM_API_KEY reste dans .env (jamais ici).

source_dir  = "samples"
build_dir   = "build"
out_dir     = "out"
lang        = "fr"
system_name = "Système bancaire (à nommer)"

# Formats traités (extensions sans le point).
formats = ["docx", "xlsx", "pptx", "pdf"]

# Étapes exécutées, dans l'ordre. Retirer une étape pour la sauter :
# chaque étape lit/écrit un artefact dans build/, donc rejouable seule
# (ex. stages = ["extract", "reconcile", "render"] pour itérer sans re-convertir).
# La passe de reconnaissance se lance seule : stages = ["recon"].
stages = ["ingest", "chunk", "extract", "reconcile", "render"]

[llm]
base_url = "https://openrouter.ai/api/v1"
model = "anthropic/claude-3.5-haiku"   # test ; en prod : endpoint OpenAI-compatible du modèle <=30B
max_context_tokens = 32000             # 256k annoncé, on reste conservateur
max_retries = 3
temperature = 0.0
timeout = 600.0                        # secondes ; inférence locale (Ollama…) lente

# LLM servi en local (laisser LLM_API_KEY vide dans .env) :
#   Ollama    : base_url = "http://localhost:11434/v1", model = "qwen2.5:32b"
#   LM Studio : base_url = "http://localhost:1234/v1"
#   vLLM      : base_url = "http://localhost:8000/v1"

[vlm]
enabled = true
model = "anthropic/claude-3.5-haiku"   # test ; en prod : Qwen2.5-VL-32B ou équivalent <=30B
prompt = "Décris ce diagramme de base de données : entités/tables, attributs lisibles, relations (cardinalités, clés étrangères). N'invente rien ; si c'est illisible, indique-le."

[chunk]
max_chars = 12000
overlap_chars = 400

[oracle]
# Accès en LECTURE SEULE au datamart (étape "recon"). Le mot de passe reste
# dans .env (ORACLE_PASSWORD). python-oracledb en mode thin : aucun Instant
# Client à installer.
dsn = "hote:1521/service"      # ou un alias TNS
user = "compte_lecture"

# Schémas à analyser. Laisser vide pour une découverte automatique (tout ce qui
# n'est pas un schéma maintenu par Oracle) — puis figer la liste ici après avoir
# lu le rapport, pour cadrer les passes suivantes.
owners = []

sample_views = 20   # vues tirées pour le test de parsing sqlglot
top_n = 50          # taille des classements du rapport
